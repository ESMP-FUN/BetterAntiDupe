# Build memory caps. Without these, Gradle and the Kotlin compiler each take whatever
# their defaults feel like, which on a machine that is also running a game and a server
# is more than this project needs. The daemons also shut down after 10 minutes idle.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
