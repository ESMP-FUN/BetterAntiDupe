# Build memory caps. Without these, Gradle and the Kotlin compiler each take whatever
# their defaults feel like, which on a machine that is also running a game and a server
# is more than this project needs. The daemons also shut down after 30 minutes idle
# instead of sitting on that memory for hours.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.daemon.idletimeout=1800000
org.gradle.parallel=true
org.gradle.caching=true
