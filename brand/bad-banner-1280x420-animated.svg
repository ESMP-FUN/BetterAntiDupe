<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Better Anti-Dupe</title>
  <desc id="d">The Better Anti-Dupe wordmark above its tagline.</desc>

  <defs>
    <radialGradient id="bglow" cx="50%" cy="50%" r="58%">
      <stop offset="0%"   stop-color="#27497A" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#27497A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#27497A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgemglow">
      <stop offset="0%"   stop-color="#4AEDD9" stop-opacity="0.20"/>
      <stop offset="45%"  stop-color="#4AEDD9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4AEDD9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" fill="#0B1729"/>
  <rect width="1280" height="420" fill="url(#bglow)"/>
  
  <text x="640" y="212.1" font-family="'Space Grotesk','Outfit','Segoe UI',system-ui,sans-serif"
        font-size="96.6" font-weight="700"
        letter-spacing="-2.87" fill="#FFFFFF"
        text-anchor="middle">Better Anti-Dupe</text>

  <text x="331.6" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#9AABC2" text-anchor="start">Stops item duplication</text>
  <g opacity="1"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">and tells you who tried.</text><rect x="637.0" y="304.38" width="311.4" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;311.4;311.4;0;0" keyTimes="0.00000;0.00000;0.14403;0.16667;0.16667;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0.00000;0.16049;0.16667;0.99383;1.00000"/></g><g opacity="0"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">before it reaches your economy.</text><rect x="637.0" y="304.38" width="433.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;433;433;0;0" keyTimes="0.00000;0.16667;0.31070;0.33333;0.33334;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.16049;0.16667;0.32716;0.33333;1.00000"/></g><g opacity="0"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">and shows you where the items went.</text><rect x="637.0" y="304.38" width="504.4" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;504.4;504.4;0;0" keyTimes="0.00000;0.33333;0.47737;0.50000;0.50000;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.32716;0.33333;0.49383;0.50000;1.00000"/></g><g opacity="0"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">inside chests, shulkers and bundles.</text><rect x="637.0" y="304.38" width="486.1" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;486.1;486.1;0;0" keyTimes="0.00000;0.50000;0.64403;0.66667;0.66667;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.49383;0.50000;0.66049;0.66667;1.00000"/></g><g opacity="0"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">without changing how items stack.</text><rect x="637.0" y="304.38" width="465.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;465;465;0;0" keyTimes="0.00000;0.66667;0.81070;0.83333;0.83334;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.66049;0.66667;0.82716;0.83333;1.00000"/></g><g opacity="0"><text x="637.0" y="289.8" font-family="'Inter','Inter Variable','Segoe UI',system-ui,sans-serif" font-size="28.0" font-weight="500" fill="#FFB000" text-anchor="start">across every server on your network.</text><rect x="637.0" y="304.38" width="500.7" height="1.54" rx="0.77" fill="#FFB000" opacity="0.10"/><rect x="637.0" y="304.38" width="0.0" height="1.54" rx="0.77" fill="#FFB000" opacity="0.45"><animate attributeName="width" dur="24.3s" repeatCount="indefinite" values="0;0;500.7;500.7;0;0" keyTimes="0.00000;0.83333;0.97737;1.00000;1.00000;1.00000"/></rect><animate attributeName="opacity" dur="24.3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.82716;0.83333;0.99383;1.00000;1.00000"/></g>
