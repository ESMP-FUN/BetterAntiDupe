# ------------------------------------------------------------------------
# BetterAntiDupe - messages.yml
#
# Every player-facing message lives here. Translate or restyle freely.
#   - Colour codes use & (e.g. &c = red, &l = bold, &r = reset).
#   - {placeholders} are filled in by the plugin - keep them, but you may
#     move them around in the sentence.
#   - Any key you DELETE falls back to the built-in English default, so
#     you only need to keep the lines you actually changed.
#
# Console log lines are intentionally not translatable (they stay English
# so errors remain searchable and support stays easy).
# ------------------------------------------------------------------------

# Shown to a player when the plugin takes duped items back off them. Only ever
# used when shadow_mode is off and auto_delete_dupes is on in config.yml.
enforcement:
  items-removed: "&c[AntiDupe] &f{amount}x {material} &7was removed from your inventory: it could not be accounted for."

alerts:
  # Broadcast to admins when a dupe is detected. {details} is one of the
  # three detail messages below.
  broadcast: "&c&l[DUPE] &e{player} &7({type}) &f{material}: &c{details}"
  # Used instead of the line above when the alert is not about one kind of item.
  broadcast-no-item: "&c&l[DUPE] &e{player} &7({type})&f: &c{details}"
  critical-suffix: " &4&l[CRITICAL]"
  balance-discrepancy: "Has {actual} but ledger shows {expected} (excess: {excess})"
  entity-dupe: "Chunk-load / drop-race dupe: entity-UUID re-used {seconds}s after original pickup"
  drop-excess: "{excess} {material} picked up beyond nearby source output ({source})"
  washed-surplus: "{excess} {material} carried without explanation, then stored away and written off"
  # More of one player's items came back out of chests, frames or the ground than they ever put
  # there. {player} is who took the last of them, {owner} whose items they were.
  world-stock: "{excess} {material} belonging to {owner} came out of storage beyond what was ever put in (last taken at {where})"
  # Sent with leaving_creative_mode: ALERT. Items can be made in creative, so this is not proof of a dupe.
  left-creative: "Left creative mode carrying {excess} more {material} than their record showed"
  # Added to an alert about an item picked up twice when the server crashed shortly before,
  # because a crash can cause that alert on its own.
  after-crash-suffix: " &6(the server did not shut down cleanly shortly before this, which can cause this alert by itself)"
  # The player's game hid a menu without closing it, then did something a normal game cannot do
  # with a menu open. {action} is one of the hidden-menu-actions below, {menu} the kind of menu.
  hidden-menu: "Tried to {action} while a {menu} menu was hidden but still open. Their game hid the menu without closing it, the way most plugin menu dupes start. The action was stopped and the menu closed."
  hidden-menu-actions:
    use: "use an item or block"
    hit: "hit something"
    break: "break a block"
    place: "place a block"
    drop: "drop an item"
    hotbar: "switch hotbar slot"
    swap: "swap hands"
    command: "run a command"
  # A plugin blocked a placement that had already spilled a chest's contents (the last eye of
  # ender over a chest in an end portal is the known case). Can happen to an innocent player.
  reverted-placement: "A blocked placement at {where} would have copied a {material} and its contents ({count} item(s) in all). The copies were removed and the {material} keeps its contents."
  # Someone holds an item whose owner mark was faked: made in creative mode, with an item editor or a
  # command, never by normal play. The item counts as unmarked. {owner} is who the fake mark names.
  forged-mark: "{amount} {material} with a fake owner mark claiming to belong to {owner}. Marks like that are made outside normal play, for example in creative mode or with an item editor. The item counts as unmarked."
  # The details text of the alert sent by /adp test alert.
  test: "This is a test alert. Nothing happened and nobody is suspected."
  # Clickable buttons after an alert, shown only to staff who can use the ledger commands.
  buttons:
    history: "&7[&bHistory&7]"
    history-hover: "Show {player}'s recent history"
    stash: "&7[&bStash&7]"
    stash-hover: "Show where {player} put tracked items"

commands:
  storage-unavailable: "&cThe item records cannot be read right now. Check the server console for the reason."
  no-permission: "&cYou don't have permission to use ledger commands."
  no-permission-update: "&cYou don't have permission to manage plugin updates."
  no-permission-admin: "&cYou don't have permission to do that."
  not-initialized: "&cChain of Custody is not initialized."
  unknown-subcommand: "&cUnknown subcommand. Use &e/adp help&c for available commands."
  unknown-ledger-subcommand: "&cUnknown ledger subcommand. Use &e/adp ledger help"
  player-lookup: "&7Looking up &e{player}&7..."
  unknown-player: "&cUnknown player: {player}"
  usage: "&cUsage: {usage}"

  help:
    header: "&8&m-----------------------------------------"
    title: "&6&lBetter Anti Dupe Commands"
    admin-lines:
      - "&e/adp ledger status &7- System status"
      - "&e/adp ledger balance <player> &7- Item balances"
      - "&e/adp ledger history <player> &7- Recent ledger entries"
      - "&e/adp ledger witness <player> &7- Witness stats"
      - "&e/adp ledger suspects &7- List suspects"
      - "&e/adp ledger stash <player> &7- Where they stashed items (clickable)"
      - "&e/adp ledger reconcile <player> &7- Force reconciliation"
      - "&e/adp ledger remove <player> &7- Take back what they carry extra"
      - "&e/adp ledger trust <player> &7- Trust score"
      - "&e/adp ledger verify &7- Verify chain integrity"
    admin-only-lines:
      - "&e/adp marks &7- How owner mark signing is doing"
      - "&e/adp fixstacks [player] &7- Make items that look the same but will not stack, stack again"
      - "&e/adp reload &7- Reload messages, alerts and removal settings"
      - "&e/adp test alert &7- Send a test alert to chat and your channels"
    user-line: "&e/adp help &7- Show this help message"
    setup-line: "&e/adp setup &7- A guided tour of the main settings"

  ledger-help:
    - "&6&lChain of Custody Commands"
    - "&e/adp ledger status &7- System status and chain tip"
    - "&e/adp ledger balance <player> &7- Player's item balances"
    - "&e/adp ledger history <player> &7- Recent ledger entries"
    - "&e/adp ledger witness <player> &7- Witness statistics"
    - "&e/adp ledger suspects &7- List current suspects"
    - "&e/adp ledger stash <player> &7- Where the player stashed items (clickable)"
    - "&e/adp ledger reconcile <player> &7- Force reconciliation"
    - "&e/adp ledger remove <player> &7- Take back what they carry extra"
    - "&e/adp ledger trust <player> &7- Trust score details"
    - "&e/adp ledger confirm <player> &7- Confirm a real duper (pins suspicion)"
    - "&e/adp ledger clear <player> &7- Mark a false positive (resets suspicion)"
    - "&e/adp ledger accept <player> <item> [amount] &7- They got this item legitimately (a reward or a shop): record it, so it stops being flagged"
    - "&e/adp ledger verify &7- Verify chain integrity"

  status:
    header: "&6&lChain of Custody Status"
    tip: "&7Chain Tip: &f{tip}..."
    hash: "&7Hash: &f{hash}..."
    suspects: "&7Active Suspects: &c{count}"
    suspect-names: "&7Suspect Names: &e{names}"

  balance:
    none: "&7No tracked items for &e{player}"
    header: "&6&lBalances for {player}"
    line-positive: "  &7{material}: &a{count}"
    line-negative: "  &7{material}: &c{count}"

  history:
    none: "&7No ledger entries for &e{player}"
    header: "&6&lRecent History for {player}"
    line: "  &7{time} &f{action} {qty} &e{material}{witness}"
    qty-gain: "&a+{n}"
    qty-loss: "&c{n}"
    witness-suffix: " &8[{count}W]"

  witness:
    header: "&6&lWitness Stats for {player}"
    total: "&7Total Actions: &f{count}"
    witnessed: "&7Witnessed: &a{count} &7({percent}%)"
    verified: "&7Verified (3+ witnesses): &a{count}"
    solo: "&7Solo (no witnesses): &e{count}"
    trust: "&7Trust Score: &f{score}/100"
    suspicious: "&c&lSUSPICIOUS: {reason}"
    ok: "&aNo suspicious patterns detected"

  suspects:
    none: "&aNo current suspects"
    header: "&6&lCurrent Suspects ({count})"
    legend: "&8&o(the item they had the most extra of, added up over all their alerts)"
    entry: "  &e{player} &7- alerts: &c{violations}"
    entry-top-material: " &7({material}: +{excess})"
    hint: "&8&oUse &e/adp ledger stash <player> &8&oto see where they stashed items."

  stash:
    none: "&7No recorded stash events for &e{player}"
    header: "&6&lRecent stashes by {player} &7(newest first, click coords to TP)"
    line-prefix: "&7{time} &f{qty}&7x &e{material} &7-> &b{container} &7@ "
    location: "&a&n[{world} {x}, {y}, {z}]"
    location-unknown: "&8(location unknown)"
    hover: "Click to teleport to this stash"

  tp:
    players-only: "&cOnly players can teleport."
    world-not-found: "&cWorld not found: {world}"
    success: "&aTeleported to {world} {x}, {y}, {z}."

  accept:
    done: "&aRecorded &e{amount} {item}&a as legitimately owned by &e{player}&a and cleared their alert."
    unknown-item: "&c'{item}' isn't an item. Use its Minecraft name, like elytra or diamond_block."
  verdict:
    confirmed: "&cConfirmed &e{player} &cas a duper. Suspicion pinned high."
    cleared: "&aCleared &e{player}&a (false positive). Suspicion reset."
    ran-command: "&7Ran punishment command: &f/{command}"

  reconcile:
    must-be-online: "&cPlayer must be online for reconciliation"
    running: "&7Running reconciliation for &e{player}&7..."
    skipped: "&7Reconciliation skipped: {reason}"
    dupe-detected: "&c&lDUPE DETECTED!"
    discrepancy: "  &c{material}: has {actual}, should have {expected} (excess: {excess})"
    tmar: "  &e{material}: {acquired}/{limit} in {window}min"
    clean: "&aNo discrepancies found - player balances verified"

  remove:
    nothing: "&a{player} is not carrying anything extra. Nothing to remove."
    preview-header: "&6&l{player} is carrying more than their record explains:"
    preview-line: "  &f{excess}x {material} &7(has {actual}, should have {expected})"
    preview-confirm: "&7Take back only these extra items? "
    confirm-button: "&c&n[Remove]"
    confirm-hover: "Counts again and removes only what is extra right now"
    removed: "  &aRemoved {removed}x {material}"
    unreachable: "  &e{amount}x {material} is inside a shulker box or bundle and was left alone"

  reload:
    done: "&aReloaded messages, alerts and removal settings."
    restart-needed: "&eThese changes only take effect after a restart: &f{settings}"
    failed: "&cReload failed: {error}. Check the console."

  fixstacks:
    # {count} is how many items needed fixing. Items that belong to someone else are left as they are.
    done: "&aChecked {player}'s inventory. &f{count} &aitem(s) fixed so they stack again."
  marks:
    off: "&7Owner marks are not signed. Turn on &fownership.signed_marks&7 in config.yml to sign them."
    header: "&6&lOwner mark signing"
    key: "&7Signing key: &f{key}&7, plus {previous} older key(s) still accepted"
    unsigned-trusted: "&7Marks from before signing: &atrusted&7, and signed as players carry them"
    unsigned-ignored: "&7Marks from before signing: &cnot trusted"
    resigned: "&7Old marks signed since the last start: &f{count}"
    forged: "&7Items with a fake mark reported to staff since the last start: &f{count}"

  test:
    no-channels: "&7No Discord, Telegram, Slack or webhook is turned on, so the test only went to chat."
    sending: "&7Sending a test alert to: &f{targets}"
    delivered: "&a  {target}: delivered"
    failed: "&c  {target}: failed ({reason})"

  trust:
    header: "&6&lTrust Score for {player}"
    score: "&7Score: {color}{score}&7/100"
    verified: "&7Verified Actions: &a{count}"
    corroborated: "&7Corroborated: &e{count}"
    solo: "&7Solo: &7{count}"
    contested: "&7Contested: &c{count}"

  verify:
    start: "&7Verifying chain integrity..."
    ok: "&a[OK] Chain integrity verified: {count} entries OK"
    fail-header: "&c&l[X] CHAIN INTEGRITY FAILURE!"
    fail-error: "&c  Error: {error}"
    fail-broken: "&c  Broken at: {entry}"
    fail-last-valid: "&c  Last valid: {entry}"

# The /adp setup tour. Each step has a title, a few lines of explanation and,
# for picks, the labels on its buttons.
setup:
  intro:
    - "&6&lWelcome to the BetterAntiDupe setup!"
    - "&7We'll go through the main settings one at a time. For each one, read what it does, then pick an answer, or Skip to leave it as it is. Nothing is forced, and you can pause or stop at any point."
  complete:
    - "&a&lAll done!"
    - "&7You've been through the main settings. Run &e/adp setup&7 again any time, or fine-tune everything in &fconfig.yml&7."
    - "&7Every choice you made is already working; there's no need to restart."
  reminder: "&eNew to BetterAntiDupe? Take a quick tour of the main settings. Nothing is forced."
  reminder-button: "&a&l[Start /adp setup]"
  reminder-resume: "&eYou started the BetterAntiDupe setup tour but didn't finish."
  reminder-resume-button: "&a&l[Carry on]"
  usage: "&cUse &e/adp setup&c to start the tour, or &e/adp setup continue&c to carry on where you paused."
  player-only: "&cThe setup tour runs in game. Join the server and type &e/adp setup&c there."
  missing-option: "&cThat button is missing its choice. Click it in the tour again."
  invalid-step: "&cThat setup step doesn't exist. Start again with &e/adp setup&c."
  requires-plugin: "&7That option needs the &e{plugin}&7 plugin, which isn't installed."
  paused: "&eSetup paused. Type &6/adp setup continue&e to carry on where you left off."
  stopped: "&7Setup stopped. Start it again any time with &e/adp setup&7."
  ui:
    dialog-title: "BetterAntiDupe Setup ({step}/{total})"
    chat-header: "&3&m                    &r &6Setup &7({step}/{total}) &3&m                    "
    complete-title: "Setup complete"
    currently: "Currently: "
    "on": "On"
    "off": "Off"
    turn-on: "Turn on"
    turn-off: "Turn off"
    turn-on-hover: "Turn this on"
    turn-off-hover: "Turn this off"
    use-hover: "Use this"
    back: "Back"
    back-hover: "Back one question"
    skip: "Skip"
    skip-hover: "Leave it as it is and go on"
    pause: "Pause"
    pause-hover: "Carry on later with /adp setup continue"
    stop: "Stop"
    stop-hover: "End the tour"
    done: "Done"
    cpu-use: "CPU use: "
    requires-plugin-button: "{plugin} is not installed"
    reminder-hover: "Opens the setup tour"
    not-set: "not set"
    default-suffix: "{value} (default)"
    value-no-limit: "No limit"
    value-one-stack: "One stack (64 items)"
    value-items: "{count} items"
    value-1-minute: "1 minute"
    value-minutes: "{count} minutes"
    value-seconds: "{count} seconds"
    severity-critical: "Only when it is certain"
    severity-high: "Strong evidence"
    severity-medium: "A clear surplus"
    severity-low: "Anything at all"
    creative-record: "Only note it down"
    creative-alert: "Also alert staff"
  steps:
    watch-only:
      title: "Only watch, never take items back?"
      desc:
        - "While this is on, the plugin records and alerts you, but never removes anything from anyone."
        - "&aOn&7 = watch and alert only (recommended while you get used to the alerts). &cOff&7 = the next question decides whether duped items are taken back."
    take-back:
      title: "Take duped items back automatically?"
      desc:
        - "When the plugin is sure enough, it takes back only the extra amount a player cannot account for, and only items it marked. Nothing else in their inventory is touched."
        - "This only works when the watch-only question before this one is &cOff&7."
        - "&aOn&7 = extra items are removed. &cOff&7 = you get the alert and decide yourself."
    take-back-sure:
      title: "How sure must it be before taking items back?"
      desc:
        - "Only matters when taking items back is on. A stricter level means fewer removals, and almost no chance of taking something a player earned fairly."
      options:
        critical: "Only when certain"
        high: "Strong evidence"
        medium: "A clear surplus"
        low: "Anything extra"
    take-back-limit:
      title: "Most items to take back at once?"
      desc:
        - "A safety net: the plugin never removes more than this in one go. For example, picking one stack means 64 items at most."
      options:
        "0": "No limit"
        "16": "16 items"
        "64": "One stack"
        "256": "4 stacks"
    tell-player:
      title: "Tell players when items are taken back?"
      desc:
        - "&aOn&7 = the player gets a message saying the extra items were removed. &cOff&7 = it happens silently, and only shows in your console and the item's history."
    alert-level:
      title: "Which alerts go to Discord, Telegram or Slack?"
      desc:
        - "Only alerts this serious or worse are sent to your channels, so small wobbles don't fill them up. Admins in game still see every alert."
        - "This only matters once you have filled in a channel in config.yml."
      options:
        low: "Every alert"
        medium: "Medium and up"
        high: "Serious ones"
        critical: "Only certain ones"
    alert-gap:
      title: "How long between repeat alerts?"
      desc:
        - "When the same player keeps setting off the same alert for the same item, your channels get it once, then wait this long before sending it again. Stops one incident becoming fifty messages."
      options:
        "10": "10 seconds"
        "30": "30 seconds"
        "60": "1 minute"
        "300": "5 minutes"
    creative:
      title: "What happens when someone leaves creative mode?"
      desc:
        - "Items can be made out of nothing in creative, so whatever a player carries when they switch back becomes their new record."
        - "&fOnly note it down&7 suits servers where staff build in creative. &fAlso alert staff&7 warns you when someone comes back with more of a watched item than before, for servers where only a few trusted people use creative."
      options:
        record: "Only note it down"
        alert: "Also alert staff"
    shutdown:
      title: "Close open menus when the server stops?"
      desc:
        - "During a restart, an item moved at just the wrong moment can be saved twice and exist twice on the next start. Closing every open chest or menu first stops that."
        - "&aOn&7 = menus close as the server stops (costs nothing). &cOff&7 = they stay open until the very end."
    language:
      title: "Which language should messages use?"
      desc:
        - "The language for every in-game message from this plugin. Your own edits in messages.yml always win, and anything a translation is missing shows in English."
      options:
        en: "English"
        pt_br: "Português"
        es: "Español"
        de: "Deutsch"
        ru: "Русский"
        pl: "Polski"
