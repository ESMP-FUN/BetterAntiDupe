# BetterAntiDupe - Español (es)
# Se activa con `language: es` en config.yml. Lo que edites en messages.yml
# tiene prioridad; las claves que falten vuelven al inglés.
# Traducción generada — ¡las correcciones de la comunidad son bienvenidas en GitHub!

alerts:
  broadcast: "&c&l[DUPE] &e{player} &7({type}) &f{material}: &c{details}"
  critical-suffix: " &4&l[CRÍTICO]"
  balance-discrepancy: "Tiene {actual}, pero el registro muestra {expected} (exceso: {excess})"
  entity-dupe: "Dupe de chunk-load / carrera de drop: UUID de entidad reutilizado {seconds}s después de la recogida original"
  drop-excess: "{excess} {material} recogido(s) más allá de lo que produjeron las fuentes cercanas ({source})"

commands:
  storage-unavailable: "&cAhora mismo no se puede leer el registro. Consulta la consola del servidor para ver el motivo."
  no-permission: "&cNo tienes permiso para usar los comandos del registro."
  not-initialized: "&cChain of Custody no está inicializado."
  unknown-subcommand: "&cSubcomando desconocido. Usa &e/adp help&c para ver los comandos."
  unknown-ledger-subcommand: "&cSubcomando desconocido. Usa &e/adp ledger help"
  player-lookup: "&7Buscando a &e{player}&7..."
  unknown-player: "&cJugador desconocido: {player}"
  usage: "&cUso: {usage}"

  help:
    header: "&8&m-----------------------------------------"
    title: "&6&lComandos de BetterAntiDupe"
    admin-lines:
      - "&e/adp ledger status &7- Estado del sistema"
      - "&e/adp ledger balance <jugador> &7- Saldos de objetos"
      - "&e/adp ledger history <jugador> &7- Entradas recientes del registro"
      - "&e/adp ledger witness <jugador> &7- Estadísticas de testigos"
      - "&e/adp ledger suspects &7- Lista de sospechosos"
      - "&e/adp ledger stash <jugador> &7- Dónde escondió los objetos (clicable)"
      - "&e/adp ledger reconcile <jugador> &7- Forzar comprobación de saldo"
      - "&e/adp ledger trust <jugador> &7- Puntuación de confianza"
      - "&e/adp ledger verify &7- Verificar la integridad de la cadena"
    user-line: "&e/adp help &7- Mostrar esta ayuda"

  ledger-help:
    - "&6&lComandos de Chain of Custody"
    - "&e/adp ledger status &7- Estado del sistema y punta de la cadena"
    - "&e/adp ledger balance <jugador> &7- Saldos de objetos del jugador"
    - "&e/adp ledger history <jugador> &7- Entradas recientes del registro"
    - "&e/adp ledger witness <jugador> &7- Estadísticas de testigos"
    - "&e/adp ledger suspects &7- Lista de sospechosos actuales"
    - "&e/adp ledger stash <jugador> &7- Dónde escondió objetos (clicable)"
    - "&e/adp ledger reconcile <jugador> &7- Forzar comprobación de saldo"
    - "&e/adp ledger trust <jugador> &7- Detalles de la puntuación de confianza"
    - "&e/adp ledger confirm <jugador> &7- Confirmar un duper real (fija la sospecha)"
    - "&e/adp ledger clear <jugador> &7- Marcar falso positivo (reinicia la sospecha)"
    - "&e/adp ledger verify &7- Verificar la integridad de la cadena"

  status:
    header: "&6&lEstado de Chain of Custody"
    tip: "&7Punta de la cadena: &f{tip}..."
    hash: "&7Hash: &f{hash}..."
    suspects: "&7Sospechosos activos: &c{count}"
    suspect-names: "&7Nombres: &e{names}"

  balance:
    none: "&7No hay objetos rastreados para &e{player}"
    header: "&6&lSaldos de {player}"
    line-positive: "  &7{material}: &a{count}"
    line-negative: "  &7{material}: &c{count}"

  history:
    none: "&7No hay entradas en el registro para &e{player}"
    header: "&6&lHistorial reciente de {player}"
    line: "  &7{time} &f{action} {qty} &e{material}{witness}"
    qty-gain: "&a+{n}"
    qty-loss: "&c{n}"
    witness-suffix: " &8[{count}T]"

  witness:
    header: "&6&lEstadísticas de testigos de {player}"
    total: "&7Acciones totales: &f{count}"
    witnessed: "&7Con testigos: &a{count} &7({percent}%)"
    verified: "&7Verificadas (3+ testigos): &a{count}"
    solo: "&7En solitario (sin testigos): &e{count}"
    trust: "&7Puntuación de confianza: &f{score}/100"
    suspicious: "&c&lSOSPECHOSO: {reason}"
    ok: "&aNo se detectaron patrones sospechosos"

  suspects:
    none: "&aNo hay sospechosos actualmente"
    header: "&6&lSospechosos actuales ({count})"
    legend: "&8&o(material: +N = exceso acumulado de ese material en todas las violaciones)"
    entry: "  &e{player} &7- &c{violations} violaciones"
    entry-top-material: " &7({material}: +{excess})"
    hint: "&8&oUsa &e/adp ledger stash <jugador> &8&opara ver dónde escondió los objetos."

  stash:
    none: "&7No hay escondites registrados para &e{player}"
    header: "&6&lEscondites recientes de {player} &7(más nuevos primero, clic para teletransportarte)"
    line-prefix: "&7{time} &f{qty}&7x &e{material} &7-> &b{container} &7@ "
    location: "&a&n[{world} {x}, {y}, {z}]"
    location-unknown: "&8(ubicación desconocida)"
    hover: "Haz clic para teletransportarte a este escondite"

  tp:
    players-only: "&cSolo los jugadores pueden teletransportarse."
    world-not-found: "&cMundo no encontrado: {world}"
    success: "&aTeletransportado a {world} {x}, {y}, {z}."

  verdict:
    confirmed: "&c{player} &cconfirmado como duper. Sospecha fijada al máximo."
    cleared: "&e{player}&a marcado como falso positivo. Sospecha reiniciada."
    ran-command: "&7Comando de castigo ejecutado: &f/{command}"

  reconcile:
    must-be-online: "&cEl jugador debe estar conectado para la comprobación"
    running: "&7Comprobando los saldos de &e{player}&7..."
    skipped: "&7Comprobación omitida: {reason}"
    dupe-detected: "&c&l¡DUPE DETECTADO!"
    discrepancy: "  &c{material}: tiene {actual}, debería tener {expected} (exceso: {excess})"
    tmar: "  &e{material}: {acquired}/{limit} en {window}min"
    clean: "&aSin discrepancias — saldos del jugador verificados"

  trust:
    header: "&6&lPuntuación de confianza de {player}"
    score: "&7Puntuación: {color}{score}&7/100"
    verified: "&7Acciones verificadas: &a{count}"
    corroborated: "&7Corroboradas: &e{count}"
    solo: "&7En solitario: &7{count}"
    contested: "&7Disputadas: &c{count}"

  verify:
    start: "&7Verificando la integridad de la cadena..."
    ok: "&a[OK] Integridad verificada: {count} entradas correctas"
    fail-header: "&c&l[X] ¡FALLO DE INTEGRIDAD DE LA CADENA!"
    fail-error: "&c  Error: {error}"
    fail-broken: "&c  Rota en: {entry}"
    fail-last-valid: "&c  Última válida: {entry}"

setup:
  intro:
    - "&6&l¡Bienvenido a la configuración de BetterAntiDupe!"
    - "&7Repasaremos los ajustes principales uno por uno. Lee qué hace cada uno y elige una respuesta, o pulsa Saltar para dejarlo tal como está. Nada es obligatorio, y puedes pausar o detener el recorrido cuando quieras."
  complete:
    - "&a&l¡Todo listo!"
    - "&7Has terminado de revisar los ajustes principales. Ejecuta &e/adp setup&7 otra vez cuando quieras, o ajusta el resto en &fconfig.yml&7."
    - "&7Todo lo que elegiste ya está funcionando; no hace falta reiniciar."
  reminder: "&e¿Nuevo en BetterAntiDupe? Haz un recorrido rápido por los ajustes principales. Nada es obligatorio."
  reminder-button: "&a&l[Iniciar /adp setup]"
  reminder-resume: "&eEmpezaste el recorrido de configuración de BetterAntiDupe pero no lo terminaste."
  reminder-resume-button: "&a&l[Continuar]"
  usage: "&cUsa &e/adp setup&c para empezar el recorrido, o &e/adp setup continue&c para seguir donde lo pausaste."
  player-only: "&cEl recorrido de configuración funciona dentro del juego. Entra al servidor y escribe &e/adp setup&c allí."
  missing-option: "&cA ese botón le falta su opción. Vuelve a pulsarlo dentro del recorrido."
  invalid-step: "&cEse paso de configuración no existe. Empieza de nuevo con &e/adp setup&c."
  requires-plugin: "&7Esa opción necesita el plugin &e{plugin}&7, que no está instalado."
  paused: "&eConfiguración pausada. Escribe &6/adp setup continue&e para seguir donde lo dejaste."
  stopped: "&7Configuración detenida. Puedes volver a abrirla cuando quieras con &e/adp setup&7."
  ui:
    dialog-title: "Configuración de BetterAntiDupe ({step}/{total})"
    chat-header: "&3&m                    &r &6Ajustes &7({step}/{total}) &3&m                    "
    complete-title: "Configuración completa"
    currently: "Ahora mismo: "
    "on": "Activado"
    "off": "Desactivado"
    turn-on: "Activar"
    turn-off: "Desactivar"
    turn-on-hover: "Activar esto"
    turn-off-hover: "Desactivar esto"
    use-hover: "Usar esta opción"
    back: "Atrás"
    back-hover: "Volver a la pregunta anterior"
    skip: "Saltar"
    skip-hover: "Dejarlo como está y seguir"
    pause: "Pausar"
    pause-hover: "Seguir luego con /adp setup continue"
    stop: "Detener"
    stop-hover: "Terminar el recorrido"
    done: "Listo"
    cpu-use: "Uso de CPU: "
    requires-plugin-button: "{plugin} no está instalado"
    reminder-hover: "Abre el recorrido de configuración"
    not-set: "sin definir"
    default-suffix: "{value} (por defecto)"
    value-no-limit: "Sin límite"
    value-one-stack: "Un stack (64 objetos)"
    value-items: "{count} objetos"
    value-1-minute: "1 minuto"
    value-minutes: "{count} minutos"
    value-seconds: "{count} segundos"
    severity-critical: "Solo cuando sea seguro"
    severity-high: "Pruebas sólidas"
    severity-medium: "Exceso claro"
    severity-low: "Cualquier exceso"
    creative-record: "Solo anotarlo"
    creative-alert: "También avisar al staff"
  steps:
    watch-only:
      title: "¿Solo vigilar y no retirar objetos?"
      desc:
        - "Mientras esté activado, el plugin registra y avisa, pero nunca quita nada a ningún jugador."
        - "&aActivado&7 = solo vigilar y avisar (recomendado mientras te acostumbras a las alertas). &cDesactivado&7 = la siguiente pregunta decide si se retiran los objetos duplicados."
    take-back:
      title: "¿Retirar automáticamente los objetos duplicados?"
      desc:
        - "Cuando el plugin esté suficientemente seguro, retira solo la cantidad extra que el jugador no pueda justificar, y solo objetos marcados por él. Nada más de su inventario se toca."
        - "Esto solo funciona si la opción anterior de solo vigilar está &cDesactivada&7."
        - "&aActivado&7 = se retiran los objetos extra. &cDesactivado&7 = recibes el aviso y decides tú."
    take-back-sure:
      title: "¿Qué tan seguro debe estar antes de retirar objetos?"
      desc:
        - "Solo importa si la retirada automática está activada. Un nivel más estricto reduce las retiradas y evita casi por completo quitar algo conseguido de forma legítima."
      options:
        critical: "Solo si es seguro"
        high: "Pruebas sólidas"
        medium: "Exceso claro"
        low: "Cualquier extra"
    take-back-limit:
      title: "¿Máximo de objetos a retirar de una vez?"
      desc:
        - "Una red de seguridad: el plugin nunca retira más de esta cantidad en una sola acción. Por ejemplo, elegir un stack equivale a 64 objetos como máximo."
      options:
        "0": "Sin límite"
        "16": "16 objetos"
        "64": "Un stack"
        "256": "4 stacks"
    tell-player:
      title: "¿Avisar al jugador cuando se retiran objetos?"
      desc:
        - "&aActivado&7 = el jugador recibe un mensaje indicando que se retiraron los objetos extra. &cDesactivado&7 = ocurre en silencio y solo figura en la consola y en el historial del objeto."
    alert-level:
      title: "¿Qué alertas llegan a Discord, Telegram o Slack?"
      desc:
        - "Solo las alertas igual o más graves que este nivel se envían a tus canales, para que pequeños desajustes no los saturen. Los administradores dentro del juego siguen viendo todas."
        - "Esto solo aplica cuando hayas configurado un canal en config.yml."
      options:
        low: "Todas las alertas"
        medium: "Media o superior"
        high: "Solo graves"
        critical: "Solo seguras"
    alert-gap:
      title: "¿Tiempo mínimo entre alertas repetidas?"
      desc:
        - "Si el mismo jugador sigue activando la misma alerta con el mismo objeto, tus canales la reciben una vez y esperan este tiempo antes de volver a avisar. Evita que un incidente se convierta en cincuenta mensajes."
      options:
        "10": "10 segundos"
        "30": "30 segundos"
        "60": "1 minuto"
        "300": "5 minutos"
    creative:
      title: "¿Qué ocurre al salir del modo creativo?"
      desc:
        - "En creativo los objetos se crean de la nada, así que todo lo que lleve el jugador al volver a supervivencia pasa a ser su nuevo registro."
        - "&fSolo anotarlo&7 conviene si el staff construye en creativo. &fTambién avisar al staff&7 te avisa si alguien sale con más objetos vigilados que antes, ideal si muy pocas personas usan creativo."
      options:
        record: "Solo anotarlo"
        alert: "También avisar"
    shutdown:
      title: "¿Cerrar menús abiertos al apagar el servidor?"
      desc:
        - "Durante un reinicio, un objeto movido en el instante justo puede guardarse dos veces y duplicarse al arrancar. Cerrar todos los cofres y menús abiertos antes lo evita."
        - "&aActivado&7 = los menús se cierran al detener el servidor (sin coste). &cDesactivado&7 = quedan abiertos hasta el final."
    language:
      title: "¿Qué idioma deben usar los mensajes?"
      desc:
        - "El idioma para todos los mensajes dentro del juego de este plugin. Tus cambios en messages.yml siempre mandan, y cualquier clave que falte se mostrará en inglés."
      options:
        en: "English"
        pt_br: "Português"
        es: "Español"
        de: "Deutsch"
        ru: "Русский"
        pl: "Polski"
