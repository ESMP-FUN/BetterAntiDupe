# BetterAntiDupe - Русский (ru)
# Включается строкой `language: ru` в config.yml. Ваши правки в messages.yml
# имеют приоритет; отсутствующие ключи берутся из английского.
# Перевод сгенерирован — исправления сообщества приветствуются на GitHub!

alerts:
  broadcast: "&c&l[DUPE] &e{player} &7({type}) &f{material}: &c{details}"
  critical-suffix: " &4&l[КРИТИЧНО]"
  balance-discrepancy: "В наличии {actual}, но в реестре {expected} (излишек: {excess})"
  entity-dupe: "Дюп через chunk-load / гонку дропа: UUID предмета использован повторно через {seconds} с после первого подбора"
  drop-excess: "Подобрано {excess} {material} сверх того, что произвели ближайшие источники ({source})"

commands:
  storage-unavailable: "&cСейчас не удаётся прочитать записи о предметах. Причина указана в консоли сервера."
  no-permission: "&cУ вас нет прав на команды реестра."
  not-initialized: "&cChain of Custody не инициализирован."
  unknown-subcommand: "&cНеизвестная подкоманда. Список команд: &e/adp help"
  unknown-ledger-subcommand: "&cНеизвестная подкоманда. См. &e/adp ledger help"
  player-lookup: "&7Ищем &e{player}&7..."
  unknown-player: "&cНеизвестный игрок: {player}"
  usage: "&cИспользование: {usage}"

  help:
    header: "&8&m-----------------------------------------"
    title: "&6&lКоманды BetterAntiDupe"
    admin-lines:
      - "&e/adp ledger status &7- Состояние системы"
      - "&e/adp ledger balance <игрок> &7- Балансы предметов"
      - "&e/adp ledger history <игрок> &7- Последние записи реестра"
      - "&e/adp ledger witness <игрок> &7- Статистика свидетелей"
      - "&e/adp ledger suspects &7- Список подозреваемых"
      - "&e/adp ledger stash <игрок> &7- Где спрятаны предметы (кликабельно)"
      - "&e/adp ledger reconcile <игрок> &7- Принудительная сверка баланса"
      - "&e/adp ledger trust <игрок> &7- Рейтинг доверия"
      - "&e/adp ledger verify &7- Проверка целостности цепочки"
    user-line: "&e/adp help &7- Показать эту справку"

  ledger-help:
    - "&6&lКоманды Chain of Custody"
    - "&e/adp ledger status &7- Состояние системы и вершина цепочки"
    - "&e/adp ledger balance <игрок> &7- Балансы предметов игрока"
    - "&e/adp ledger history <игрок> &7- Последние записи реестра"
    - "&e/adp ledger witness <игрок> &7- Статистика свидетелей"
    - "&e/adp ledger suspects &7- Текущие подозреваемые"
    - "&e/adp ledger stash <игрок> &7- Где игрок спрятал предметы (кликабельно)"
    - "&e/adp ledger reconcile <игрок> &7- Принудительная сверка баланса"
    - "&e/adp ledger trust <игрок> &7- Подробности рейтинга доверия"
    - "&e/adp ledger confirm <игрок> &7- Подтвердить дюпера (фиксирует подозрение)"
    - "&e/adp ledger clear <игрок> &7- Ложное срабатывание (сброс подозрения)"
    - "&e/adp ledger verify &7- Проверка целостности цепочки"

  status:
    header: "&6&lСостояние Chain of Custody"
    tip: "&7Вершина цепочки: &f{tip}..."
    hash: "&7Хеш: &f{hash}..."
    suspects: "&7Активных подозреваемых: &c{count}"
    suspect-names: "&7Имена: &e{names}"

  balance:
    none: "&7Нет отслеживаемых предметов у &e{player}"
    header: "&6&lБалансы {player}"
    line-positive: "  &7{material}: &a{count}"
    line-negative: "  &7{material}: &c{count}"

  history:
    none: "&7Нет записей реестра для &e{player}"
    header: "&6&lПоследние записи {player}"
    line: "  &7{time} &f{action} {qty} &e{material}{witness}"
    qty-gain: "&a+{n}"
    qty-loss: "&c{n}"
    witness-suffix: " &8[{count}С]"

  witness:
    header: "&6&lСтатистика свидетелей {player}"
    total: "&7Всего действий: &f{count}"
    witnessed: "&7При свидетелях: &a{count} &7({percent}%)"
    verified: "&7Подтверждено (3+ свидетеля): &a{count}"
    solo: "&7Без свидетелей: &e{count}"
    trust: "&7Рейтинг доверия: &f{score}/100"
    suspicious: "&c&lПОДОЗРИТЕЛЬНО: {reason}"
    ok: "&aПодозрительных закономерностей не обнаружено"

  suspects:
    none: "&aПодозреваемых сейчас нет"
    header: "&6&lТекущие подозреваемые ({count})"
    legend: "&8&o(материал: +N = суммарный излишек этого материала по всем нарушениям)"
    entry: "  &e{player} &7- &c{violations} нарушений"
    entry-top-material: " &7({material}: +{excess})"
    hint: "&8&oКоманда &e/adp ledger stash <игрок> &8&oпокажет, где спрятаны предметы."

  stash:
    none: "&7Нет записей о тайниках у &e{player}"
    header: "&6&lНедавние тайники {player} &7(сначала новые, клик по координатам — телепорт)"
    line-prefix: "&7{time} &f{qty}&7x &e{material} &7-> &b{container} &7@ "
    location: "&a&n[{world} {x}, {y}, {z}]"
    location-unknown: "&8(место неизвестно)"
    hover: "Нажмите, чтобы телепортироваться к тайнику"

  tp:
    players-only: "&cТелепортироваться могут только игроки."
    world-not-found: "&cМир не найден: {world}"
    success: "&aТелепортация: {world} {x}, {y}, {z}."

  verdict:
    confirmed: "&c{player} &cподтверждён как дюпер. Подозрение зафиксировано."
    cleared: "&e{player}&a — ложное срабатывание. Подозрение сброшено."
    ran-command: "&7Выполнена команда наказания: &f/{command}"

  reconcile:
    must-be-online: "&cДля сверки игрок должен быть в сети"
    running: "&7Сверяем балансы &e{player}&7..."
    skipped: "&7Сверка пропущена: {reason}"
    dupe-detected: "&c&lОБНАРУЖЕН ДЮП!"
    discrepancy: "  &c{material}: в наличии {actual}, должно быть {expected} (излишек: {excess})"
    tmar: "  &e{material}: {acquired}/{limit} за {window} мин"
    clean: "&aРасхождений нет — балансы игрока подтверждены"

  trust:
    header: "&6&lРейтинг доверия {player}"
    score: "&7Рейтинг: {color}{score}&7/100"
    verified: "&7Подтверждённые действия: &a{count}"
    corroborated: "&7Засвидетельствованные: &e{count}"
    solo: "&7Без свидетелей: &7{count}"
    contested: "&7Спорные: &c{count}"

  verify:
    start: "&7Проверяем целостность цепочки..."
    ok: "&a[OK] Целостность подтверждена: записей в порядке — {count}"
    fail-header: "&c&l[X] НАРУШЕНА ЦЕЛОСТНОСТЬ ЦЕПОЧКИ!"
    fail-error: "&c  Ошибка: {error}"
    fail-broken: "&c  Разрыв на записи: {entry}"
    fail-last-valid: "&c  Последняя корректная: {entry}"

setup:
  intro:
    - "&6&lДобро пожаловать в настройку BetterAntiDupe!"
    - "&7Мы по очереди пройдёмся по основным параметрам. Прочитайте описание каждого из них и выберите ответ, или нажмите Пропустить, чтобы оставить как есть. Ничего не навязывается, и вы можете поставить мастер на паузу или остановить его в любой момент."
  complete:
    - "&a&lГотово!"
    - "&7Вы прошли основные настройки. Запустить &e/adp setup&7 снова можно в любое время, а тонкую настройку выполнить в &fconfig.yml&7."
    - "&7Все выбранные параметры уже работают; перезапуск не нужен."
  reminder: "&eВпервые пользуетесь BetterAntiDupe? Пройдите короткий обзор основных настроек. Ничего не навязывается."
  reminder-button: "&a&l[Открыть /adp setup]"
  reminder-resume: "&eВы начали мастер настройки BetterAntiDupe, но не закончили его."
  reminder-resume-button: "&a&l[Продолжить]"
  usage: "&cИспользуйте &e/adp setup&c для начала или &e/adp setup continue&c, чтобы продолжить с места паузы."
  player-only: "&cМастер настройки работает только в игре. Зайдите на сервер и введите &e/adp setup&c там."
  missing-option: "&cУ этой кнопки не указан вариант. Нажмите её ещё раз в мастере."
  invalid-step: "&cТакого шага настройки нет. Начните заново командой &e/adp setup&c."
  requires-plugin: "&7Для этой настройки нужен плагин &e{plugin}&7, но он не установлен."
  paused: "&eНастройка приостановлена. Введите &6/adp setup continue&e, чтобы продолжить с того же места."
  stopped: "&7Настройка остановлена. Можно запустить её снова в любой момент командой &e/adp setup&7."
  ui:
    dialog-title: "Настройка BetterAntiDupe ({step}/{total})"
    chat-header: "&3&m                    &r &6Настройка &7({step}/{total}) &3&m                    "
    complete-title: "Настройка завершена"
    currently: "Сейчас: "
    "on": "Вкл"
    "off": "Выкл"
    turn-on: "Включить"
    turn-off: "Выключить"
    turn-on-hover: "Включить этот параметр"
    turn-off-hover: "Выключить этот параметр"
    use-hover: "Выбрать этот вариант"
    back: "Назад"
    back-hover: "Вернуться к предыдущему вопросу"
    skip: "Пропустить"
    skip-hover: "Оставить как есть и идти дальше"
    pause: "Пауза"
    pause-hover: "Продолжить позже через /adp setup continue"
    stop: "Стоп"
    stop-hover: "Завершить мастер"
    done: "Готово"
    cpu-use: "Нагрузка на CPU: "
    requires-plugin-button: "{plugin} не установлен"
    reminder-hover: "Открывает мастер настройки"
    not-set: "не задано"
    default-suffix: "{value} (по умолчанию)"
    value-no-limit: "Без ограничения"
    value-one-stack: "Один стак (64 шт.)"
    value-items: "{count} шт."
    value-1-minute: "1 минута"
    value-minutes: "{count} мин."
    value-seconds: "{count} сек."
    severity-critical: "Только при полной уверенности"
    severity-high: "Веские основания"
    severity-medium: "Заметный излишек"
    severity-low: "Любой излишек"
    creative-record: "Только записывать"
    creative-alert: "Также предупреждать персонал"
  steps:
    watch-only:
      title: "Только наблюдать и не изымать предметы?"
      desc:
        - "Пока этот режим включён, плагин ведёт учёт и присылает уведомления, но никогда ничего ни у кого не забирает."
        - "&aВкл&7 = только наблюдение и оповещения (рекомендуется на первое время). &cВыкл&7 = следующий вопрос определит, будут ли дюпнутые предметы изыматься."
    take-back:
      title: "Изымать дюпнутые предметы автоматически?"
      desc:
        - "Когда плагин достаточно уверен, он забирает только неучтённый излишек и только предметы с собственной меткой. Остальной инвентарь не трогается."
        - "Работает только если режим наблюдения выше &cВыключен&7."
        - "&aВкл&7 = лишние предметы удаляются. &cВыкл&7 = вы получаете уведомление и решаете сами."
    take-back-sure:
      title: "Насколько уверенным должен быть плагин перед изъятием?"
      desc:
        - "Важно только при включённом автоизъятии. Более высокий порог уменьшает число срабатываний и почти исключает риск забрать честно полученные предметы."
      options:
        critical: "Только точно"
        high: "Веские данные"
        medium: "Явный излишек"
        low: "Любой лишний"
    take-back-limit:
      title: "Максимум предметов для изъятия за раз?"
      desc:
        - "Предохранитель: плагин никогда не заберёт больше этого числа за одно действие. Например, один стак означает не более 64 предметов."
      options:
        "0": "Без лимита"
        "16": "16 предметов"
        "64": "Один стак"
        "256": "4 стака"
    tell-player:
      title: "Сообщать игрокам при изъятии предметов?"
      desc:
        - "&aВкл&7 = игрок получает сообщение об удалении лишних предметов. &cВыкл&7 = изъятие проходит тихо и отображается только в консоли и истории предмета."
    alert-level:
      title: "Какие уведомления отправлять в Discord, Telegram или Slack?"
      desc:
        - "В ваши каналы отправляются только уведомления этой или более высокой серьёзности, чтобы мелкие расхождения не засоряли чат. Администраторы в игре по-прежнему видят все."
        - "Имеет значение только после указания канала в config.yml."
      options:
        low: "Все уведомления"
        medium: "Средние и выше"
        high: "Серьёзные"
        critical: "Только точные"
    alert-gap:
      title: "Пауза между повторными уведомлениями?"
      desc:
        - "Если один и тот же игрок продолжает вызывать одно и то же предупреждение по тому же предмету, каналы получат его один раз и подождут столько перед следующим. Не даёт одному случаю превратиться в пятьдесят сообщений."
      options:
        "10": "10 секунд"
        "30": "30 секунд"
        "60": "1 минута"
        "300": "5 минут"
    creative:
      title: "Что делать при выходе из творческого режима?"
      desc:
        - "В творческом режиме предметы можно брать из ниоткуда, поэтому при возврате всё, что игрок несёт с собой, становится его новой точкой отсчёта."
        - "&fТолько записывать&7 подходит серверам, где команда строит в креативе. &fТакже предупреждать&7 оповещает, если игрок выходит с большим числом отслеживаемых предметов, чем было раньше."
      options:
        record: "Только записывать"
        alert: "Также сообщать"
    shutdown:
      title: "Закрывать открытые меню при остановке сервера?"
      desc:
        - "При перезапуске предмет, перемещённый в неподходящий момент, может сохраниться с обеих сторон и удвоиться при следующем запуске. Предварительное закрытие всех сундуков и меню предотвращает это."
        - "&aВкл&7 = меню закрываются при остановке сервера (без нагрузки). &cВыкл&7 = остаются открытыми до конца."
    language:
      title: "На каком языке показывать сообщения?"
      desc:
        - "Язык всех игровых сообщений этого плагина. Ваши правки в messages.yml всегда имеют приоритет, а отсутствующие переводы берутся из английского."
      options:
        en: "English"
        pt_br: "Português"
        es: "Español"
        de: "Deutsch"
        ru: "Русский"
        pl: "Polski"
